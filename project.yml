name: ShukatsuBoard
options:
  bundleIdPrefix: com.sl21ku
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: 69A95U4T99
targets:
  ShukatsuBoard:
    type: application
    platform: iOS
    sources:
      - ShukatsuBoard
    info:
      path: ShukatsuBoard/Support/Info.plist
      properties:
        CFBundleDisplayName: Shukatsu Board
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: ShukatsuBoard/Support/ShukatsuBoard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sl21ku.ShukatsuBoard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sl21ku.ShukatsuBoard
        INFOPLIST_FILE: ShukatsuBoard/Support/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: ShukatsuBoard App Store
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: ShareExtension
        embed: true

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Shukatsu Board Share
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sl21ku.ShukatsuBoard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sl21ku.ShukatsuBoard.ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: ShukatsuBoard Share App Store
        TARGETED_DEVICE_FAMILY: "1"

  ShukatsuBoardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/ShukatsuBoardTests
    dependencies:
      - target: ShukatsuBoard

  ShukatsuBoardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/ShukatsuBoardUITests
    dependencies:
      - target: ShukatsuBoard
    settings:
      base:
        TEST_TARGET_NAME: ShukatsuBoard

schemes:
  ShukatsuBoard:
    build:
      targets:
        ShukatsuBoard: all
        ShareExtension: all
        ShukatsuBoardTests: [test]
        ShukatsuBoardUITests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: ShukatsuBoardTests
        - name: ShukatsuBoardUITests
