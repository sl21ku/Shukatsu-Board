name: ShukatsuBoard
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
targets:
  ShukatsuBoard:
    type: application
    platform: iOS
    sources:
      - ShukatsuBoard
    info:
      path: ShukatsuBoard/Support/Info.plist
      properties:
        CFBundleDisplayName: Shukatsu Board
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: ShukatsuBoard/Support/ShukatsuBoard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.ShukatsuBoard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ShukatsuBoard
        INFOPLIST_FILE: ShukatsuBoard/Support/Info.plist
    dependencies:
      - target: ShareExtension
        embed: true

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Shukatsu Board Share
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.ShukatsuBoard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ShukatsuBoard.ShareExtension
        INFOPLIST_FILE: ShareExtension/Info.plist

  ShukatsuBoardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/ShukatsuBoardTests
    dependencies:
      - target: ShukatsuBoard
